<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Catálogo de Patrones UI sobre los laboratorios del 4to piso del módulo 236 de la FICCT (UAGRM)." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F4E79'/%3E%3Crect x='7' y='8' width='18' height='12' rx='1.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 24h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Laboratorios FICCT – Patrones UI</title>
    <script>
      // Aplica el tema antes de pintar la página para evitar un parpadeo.
      (function () {
        var tema = 'claro';
        try {
          var guardado = localStorage.getItem('patrones-ui:tema');
          if (guardado === 'oscuro' || guardado === 'claro') tema = guardado;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) tema = 'oscuro';
        } catch (e) {}
        document.documentElement.setAttribute('data-tema', tema);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
